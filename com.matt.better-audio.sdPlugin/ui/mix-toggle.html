<!DOCTYPE html>
<html>
	<head lang="en">
		<title>Toggle Mix</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Output">
			<sdpi-select
				setting="output"
				datasource="getOutputs"
				default="main"
				loading="Loading Wave Link outputs..."
				placeholder="Main output"
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Mix">
			<sdpi-select
				setting="mix"
				datasource="getMixes"
				loading="Loading Wave Link mixes..."
				placeholder="Select a mix"
			></sdpi-select>
		</sdpi-item>
	</body>
</html>
